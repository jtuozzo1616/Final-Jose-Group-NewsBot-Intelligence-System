name: Rubric verification - advanced features and real historical data
on:
  push:
    paths:
      - 'final-newsbot-2.0/newsbot2/advanced.py'
      - 'final-newsbot-2.0/tests/test_rubric.py'
      - 'final-newsbot-2.0/run_real_evidence.py'
      - '.github/workflows/rubric-verification.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: final-newsbot-2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python run_real_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-bbc-aggregate-evidence
          path: final-newsbot-2.0/evidence/real_bbc_final_evaluation.json
      - name: Publish aggregate evidence
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f evidence/real_bbc_final_evaluation.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish real historical BBC final-pipeline evaluation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
