name: Pretrained text generation evidence
on:
  push:
    paths:
      - 'final-newsbot-2.0/newsbot2/generation.py'
      - 'final-newsbot-2.0/run_generation_evidence.py'
      - '.github/workflows/newsbot-generation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: final-newsbot-2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-core.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'transformers>=4.45,<5' sentencepiece
      - name: Real pretrained inference
        env:
          OMP_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: python run_generation_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: pretrained-generation-evidence
          path: final-newsbot-2.0/evidence/generation_results.json
      - name: Publish real inference evidence
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f evidence/generation_results.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish actual pretrained text-generation results [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
