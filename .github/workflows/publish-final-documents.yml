name: Publish verified final documents
on:
  push:
    paths: ['.github/workflows/publish-final-documents.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: rubric-documents-tutorials
          path: /tmp/newsbot-final-documents
          run-id: 45692010672
          github-token: ${{ github.token }}
      - name: Publish exact verified deliverables and tutorials
        run: |
          cp /tmp/newsbot-final-documents/submission/FP_* final-newsbot-2.0/submission/
          cp /tmp/newsbot-final-documents/reports/*.pdf /tmp/newsbot-final-documents/reports/*.pptx final-newsbot-2.0/reports/
          cp /tmp/newsbot-final-documents/evidence/tutorials/*.ipynb final-newsbot-2.0/evidence/tutorials/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f final-newsbot-2.0/submission/ final-newsbot-2.0/reports/ final-newsbot-2.0/evidence/tutorials/
          git diff --cached --quiet && exit 0
          git commit -m 'Publish exact verified final 18-slide presentation and rubric PDFs [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
