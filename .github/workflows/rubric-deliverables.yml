name: Rubric deliverables and seven executed tutorials
on:
  push:
    paths:
      - 'final-newsbot-2.0/build_rubric_deliverables.py'
      - '.github/workflows/rubric-deliverables.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: final-newsbot-2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt python-pptx pypdf nbconvert ipykernel
      - run: python build_rubric_deliverables.py
      - name: Execute seven tutorials
        run: |
          mkdir -p evidence/tutorials
          for f in notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute "$f" --output-dir evidence/tutorials --ExecutePreprocessor.timeout=300
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rubric-documents-tutorials
          path: |
            final-newsbot-2.0/reports/
            final-newsbot-2.0/submission/
            final-newsbot-2.0/evidence/tutorials/
      - name: Publish verified files
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/ submission/ evidence/tutorials/
          git diff --cached --quiet && exit 0
          git commit -m 'Publish rubric-compliant reports, 18-slide deck and executed tutorials [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
